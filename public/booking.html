<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Luxurious+Script&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Gentium Book Plus', serif; color: #3a3226; background-color: #d4c5a9; background-image: linear-gradient(135deg, #d9ccb0 0%, #cfc2a4 25%, #d6cab0 50%, #cdc0a6 75%, #d4c7ab 100%); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #000000; padding: 20px 0 22px; position: relative; flex-shrink: 0; }
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: center; gap: 35px; padding: 0 20px; }
        nav a { color: #d4c5a9; text-decoration: none; font-family: 'Luxurious Script', cursive; font-size: 32px; letter-spacing: 2px; transition: color 0.3s; line-height: 1.2; }
        nav a:hover { color: #c9a96e; }
        .header-line { max-width: 1200px; margin: 0 auto; margin-top: 5px; height: 1px; background: linear-gradient(90deg, transparent, #c9a96e 20%, #c9a96e 80%, transparent); }
        .hero { width: 100%; max-width: 1200px; margin: 0 auto; overflow: hidden; position: relative; flex-shrink: 0; }
        .hero img { width: 100%; height: auto; display: block; max-height: 500px; object-fit: cover; }
        .content { max-width: 1200px; margin: 0 auto; padding: 60px 30px; flex-grow: 1; width: 100%; }
        .section-title { font-family: 'Luxurious Script', cursive; font-size: 56px; color: #3a3226; text-align: center; margin-bottom: 40px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .section-title::before, .section-title::after { content: '♦'; font-size: 14px; color: #c9a96e; }
        .booking-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-bottom: 60px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-family: 'Luxurious Script', cursive; font-size: 28px; color: #3a3226; margin-bottom: 10px; padding-left: 5px; }
        .form-group input { background: transparent; border: 2px solid #c9a96e; padding: 15px; font-family: 'Gentium Book Plus', serif; font-size: 18px; color: #3a3226; outline: none; }
        .form-group input:focus { border-color: #8a6d3b; background-color: rgba(255, 255, 255, 0.3); }
        .submit-btn-container { grid-column: 1 / -1; text-align: center; margin-top: 20px; }
        .submit-btn { background-color: #3a3226; color: #d4c5a9; border: none; padding: 15px 50px; font-family: 'Luxurious Script', cursive; font-size: 24px; cursor: pointer; transition: background 0.3s; }
        .submit-btn:hover { background-color: #c9a96e; color: #000; }
        footer { max-width: 1200px; margin: 0 auto; padding: 0 30px 50px; border-top: 1px solid #b8a88a; padding-top: 30px; display: flex; justify-content: space-between; gap: 40px; width: 100%; }
        .footer-block h3 { font-family: 'Luxurious Script', cursive; font-size: 32px; color: #3a3226; margin-bottom: 12px; }
        .footer-block p { font-size: 16px; color: #3a3226; line-height: 1.8; }
        @media (max-width: 900px) { .booking-form { grid-template-columns: repeat(2, 1fr); } nav { gap: 15px; flex-wrap: wrap; } nav a { font-size: 24px; } .section-title { font-size: 42px; } footer { flex-direction: column; text-align: center; } }
        @media (max-width: 600px) { .booking-form { grid-template-columns: 1fr; } nav a { font-size: 20px; } .section-title { font-size: 36px; } .hero img { max-height: 300px; } }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Main</a>
            <a href="menu.html">Menu</a>
            <a href="booking.html">Booking</a>
            <a href="events.html">Events</a>
            <a href="contacts.html">Contacts</a>
            <a href="revies.html">Reviews</a>
            <a href="chefs.html">Chefs</a>
            <a href="login.html">Login</a>
        </nav>
        <div class="header-line"></div>
    </header>

    <div class="hero">
        <img src="Rectangle 34 (1).png" alt="Restaurant Fountain Exterior">
    </div>

    <div class="content">
        <h2 class="section-title">Booking</h2>
        <form class="booking-form" id="bookingForm">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="name">Your name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="guests">Guests</label>
                <input type="number" id="guests" min="1" max="20" placeholder="2" required>
            </div>
            <div class="form-group">
                <label for="time">Time</label>
                <input type="time" id="time" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" placeholder="+1 234 567 890" required>
            </div>
            <div class="submit-btn-container">
                <button type="submit" class="submit-btn">Confirm Booking</button>
            </div>
        </form>
    </div>

    <footer>
        <div class="footer-block"><h3>Contacts</h3><p>Orenburg, Mira St., 4B</p></div>
        <div class="footer-block"><h3>Restaurant opening hours</h3><p>Mon-Sun 12.00 – 24.00</p></div>
    </footer>

    <!-- ЛОГИКА БРОНИРОВАНИЯ -->
    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            // Останавливаем перезагрузку страницы
            e.preventDefault();
            
            // Просто показываем сообщение об успехе (для отчета)
            alert('✅ Бронь успешно создана! Столик забронирован.');
            
            // Очищаем форму
            this.reset();
        });
    </script>
</body>
</html>
